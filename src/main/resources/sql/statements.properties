# 3. Заказ

sql.Order.ADD = INSERT INTO public.orders(status_id, patient_id, organization_id, \
  registered_by, accepted_by, verified_by, registration_datetime, acceptance_datetime, \
  verification_datetime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?);

sql.Order.FIND_BY_ID = SELECT id_order, status_id, patient_id, organization_id, \
  registered_by, accepted_by, verified_by, registration_datetime, acceptance_datetime, \
  verification_datetime FROM public.orders WHERE id_order = ?;

sql.Order.GET_ALL = SELECT id_order, status_id, patient_id, organization_id, \
  registered_by, accepted_by, verified_by, registration_datetime, acceptance_datetime, \
  verification_datetime FROM public.orders;

sql.Order.UPDATE = UPDATE public.orders SET status_id=?, patient_id=?, organization_id=?, \
  registered_by=?, accepted_by=?, verified_by=?, registration_datetime=?, acceptance_datetime=?, \
  verification_datetime=? WHERE id_order = ?;

sql.Order.DELETE_BY_ID = DELETE FROM public.orders WHERE id_order = ?;

sql.Order.FIND_BY_PATIENT_ID = SELECT id_order, status_id, patient_id, organization_id, \
  registered_by, accepted_by, verified_by, registration_datetime, acceptance_datetime, \
  verification_datetime FROM public.orders WHERE patient_id = ?;

sql.Order.FIND_BY_STATUS_ID = SELECT id_order, status_id, patient_id, organization_id, \
  registered_by, accepted_by, verified_by, registration_datetime, acceptance_datetime, \
  verification_datetime FROM public.orders WHERE status_id = ?;

sql.Order.FIND_BY_DATE_RANGE = SELECT id_order, status_id, patient_id, organization_id, \
  registered_by, accepted_by, verified_by, registration_datetime, acceptance_datetime, verification_datetime \
  FROM public.orders \
  WHERE registration_datetime >= ? AND registration_datetime <= ? \
  ORDER BY registration_datetime DESC;

sql.Order.FIND_BY_REGISTERED_BY = SELECT id_order, status_id, patient_id, organization_id, \
  registered_by, accepted_by, verified_by, registration_datetime, acceptance_datetime, verification_datetime \
  FROM public.orders WHERE registered_by = ?;

sql.Order.FIND_BY_SPECIMEN_BARCODE = SELECT o.id_order, o.status_id, o.patient_id, o.organization_id, \
  o.registered_by, o.accepted_by, o.verified_by, o.registration_datetime, o.acceptance_datetime, \
  o.verification_datetime \
  FROM public.orders o \
  JOIN public.specimens s ON o.id_order = s.order_id \
  WHERE s.barcode = ?;

sql.Order.UPDATE_STATUS = UPDATE public.orders SET status_id = ? WHERE id_order = ?;


