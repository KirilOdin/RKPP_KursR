# 1. Тест

sql.AnalysisTest.ADD = INSERT INTO public.tests(test_name, biomaterial, \
  execution_time_hours, price, unit) \
  VALUES (?, ?, ?, ?, ?);

sql.AnalysisTest.FIND_BY_ID = SELECT id_test, test_name, biomaterial, \
  execution_time_hours, price, unit FROM public.tests \
  WHERE id_test = ?;

sql.AnalysisTest.GET_ALL = SELECT id_test, test_name, biomaterial, \
  execution_time_hours, price, unit FROM public.tests;

sql.AnalysisTest.UPDATE = UPDATE public.tests SET test_name=?, biomaterial=?, \
  execution_time_hours=?, price=?, unit=? \
  WHERE id_test = ?;

sql.AnalysisTest.DELETE_BY_ID = DELETE FROM public.tests WHERE id_test = ?;

sql.AnalysisTest.FIND_BY_MATERIAL = SELECT id_test, test_name, biomaterial, \
  execution_time_hours, price, unit \
  FROM public.tests WHERE biomaterial =?;

sql.SEARCH_BY_NAME = SELECT id_test, test_name, biomaterial, \
  execution_time_hours, price, unit \
  FROM public.tests WHERE test_name ILIKE ?;



